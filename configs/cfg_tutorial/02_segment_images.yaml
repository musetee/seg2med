# Stage 2: consume the catalog made by stage 1.
# python -m seg2med_workflow.segment_images --config configs/cfg_tutorial/02_segment_images.yaml
## ct version
# source:
#   type: catalog
#   path: cfg_tutorial\seg2med_orig.csv
#   image_column: img
#   # datasets: [synthrad_ct]
#   # modalities: [0]
#   # limit: 2
# tasks: [total, tissue_types]
# device: gpu
# multi_label: true
# fast: false
# overwrite: true
# continue_on_error: false

# mr version
source:
  type: catalog
  path: cfg_tutorial\seg2med_orig.csv
  image_column: img
  datasets: [synthrad_mr_t1, synthrad_mr_t2]
  modalities: [1, 2]
tasks: [total_mr, tissue_types_mr]
device: gpu
multi_label: true
fast: false
overwrite: true
continue_on_error: false

# Omit output_dir to save masks next to each input image. This naming matches
# the catalog convention: *_seg.nii.gz and *_seg_tissue.nii.gz.
# output_dir: ${SEG2MED_DATA_ROOT}/segmentations
